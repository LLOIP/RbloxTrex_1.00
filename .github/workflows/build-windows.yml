name: Build RBloxTrex

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Upgrade pip
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install OpenCV and dependencies
        shell: powershell
        run: |
          python -m pip install --no-cache-dir opencv-python
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -m pip install --no-cache-dir numpy mss PySide6 pywin32 psutil pyinstaller
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify cv2 installation
        shell: powershell
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__)"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "OpenCV cv2 failed to import."
            exit 1
          }

          python -c "import numpy, mss, PySide6, win32gui, psutil; print('All dependencies loaded.')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build RBloxTrex
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name RBloxTrex `
            --collect-all cv2 `
            --collect-all numpy `
            --collect-all PySide6 `
            --hidden-import cv2 `
            --hidden-import win32gui `
            --hidden-import win32process `
            --hidden-import win32con `
            --hidden-import psutil `
            src/main.py

          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify EXE exists
        shell: powershell
        run: |
          if (!(Test-Path "dist/RBloxTrex.exe")) {
            Write-Error "RBloxTrex.exe was not generated."
            exit 1
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RBloxTrex-Windows
          path: dist/RBloxTrex.exe
