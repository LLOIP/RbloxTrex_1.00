name: Build ResolShaders for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify dependencies and source
        shell: pwsh
        run: |
          python -c "import cv2, numpy, PySide6, win32gui, psutil, windows_capture; print('Dependencies OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile src/main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ResolShaders --icon ResolShaders.ico --add-data "ResolShaders.ico;." --collect-all cv2 --collect-all numpy --collect-all PySide6 --collect-all windows_capture --hidden-import win32gui --hidden-import win32process --hidden-import win32con --hidden-import psutil src/main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/ResolShaders.exe")) { throw "ResolShaders.exe was not created" }
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResolShaders-Windows-x64
          path: dist/ResolShaders.exe
          if-no-files-found: error
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ResolShaders.exe
